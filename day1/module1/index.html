<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Hello FARM</h1>

    <!-- Slide 14 stretch: objects + arrays -->
    <button class="secondary" onclick="showCourse()">Show Course Info</button>
  </main>

  <!-- Load JavaScript LAST so the elements above already exist -->
  <script src="app.js"></script>
</body>
</html>
